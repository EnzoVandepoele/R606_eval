name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ma_bdd
          MYSQL_USER: db_user
          MYSQL_PASSWORD: db_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: ./src

      - name: Run migrations
        run: php migrate.php
        working-directory: ./src
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ma_bdd
          DB_USER: db_user
          DB_PASS: db_pwd

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
        working-directory: ./src
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ma_bdd
          DB_USER: db_user
          DB_PASS: db_pwd

  lint:
    name: Lint PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: ./src

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --configuration ../phpstan.neon
        working-directory: ./src

  deploy:
    name: Déploiement FTP
    runs-on: ubuntu-latest
    needs: [tests, lint]  # déploie seulement si tests + lint passent
    if: github.ref == 'refs/heads/master'  # uniquement sur master

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./src/
          server-dir: /www/
          exclude: |
            **/.git*
            **/tests/**
            **/vendor/**
            **/migrations.json